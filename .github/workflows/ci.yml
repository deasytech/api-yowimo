name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis, pdo_sqlite, intl, gd, zip, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

  tests:
    name: Pest
    runs-on: ubuntu-latest

    # The health-check tests connect to a real Redis; everything else
    # (database, cache, queue, broadcasting) is overridden in phpunit.xml.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis, pdo_sqlite, intl, gd, zip, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --no-progress --prefer-dist
          php artisan key:generate

      - name: Run tests
        run: php artisan test
        env:
          # FakesClerkWebhook signs test payloads with whatever secret is in
          # the environment; a throwaway one is enough (base64 of 32 bytes).
          CLERK_WEBHOOK_SECRET: whsec_Y2ktdGVzdC1vbmx5LXdlYmhvb2stc2VjcmV0LTAwMDA=
